# CI — runs on every push and PR. Three independent jobs: backend
# (syntax/require-walk/audit), client (build/audit), and a smoke-test job
# that runs the real integration smoke test against an actual MongoDB
# service container.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — syntax, require-walk, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every backend file
        run: |
          find src -name "*.js" | while read f; do
            node --check "$f" || exit 1
          done

      - name: Require-walk (catches import errors, missing exports, broken references)
        run: |
          node -e "
          const fs = require('fs'); const path = require('path');
          let ok = true;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              // src/tests holds Jest suites that use beforeAll/it/expect —
              // real Jest globals that only exist under the Jest runner
              // (npm test, run separately below), not under plain \`node\`.
              // Requiring them here would always fail with 'beforeAll is
              // not defined', so they're walked by npm test instead.
              if (entry.isDirectory()) { if (full !== 'src/tests') walk(full); }
              else if (entry.name.endsWith('.js') && !full.startsWith('src/tests/') && !full.endsWith('server.js') && !full.endsWith('seed.js') && !full.endsWith('seedPlatformAdmin.js') && !full.endsWith('smokeTest.js')) {
                try { require(path.resolve(full)); } catch (e) { ok = false; console.log('FAIL', full, '->', e.message); }
              }
            }
          }
          walk('src');
          if (!ok) process.exit(1);
          console.log('Require-walk passed.');
          "

      - name: npm audit (fails the build on any high/critical vulnerability)
        run: npm audit --audit-level=high

  client:
    name: Client — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # --omit=dev: the only high-severity advisories in this project's
      # client deps are dev-server-only (e.g. esbuild's dev-server
      # request-spoofing issue, GHSA-67mh-4wv8-2f99), which only matter if
      # someone runs `vite`'s dev server on a machine an attacker can reach —
      # they ship in devDependencies and are never part of the production
      # build output above. Auditing devDependencies here would fail CI on a
      # vulnerability that can't actually affect a deployed build;
      # production dependencies are still audited at full strictness.
      - name: npm audit (fails the build on any high/critical vulnerability in production dependencies)
        run: npm audit --omit=dev --audit-level=high

  smoke-test:
    name: Smoke test (real MongoDB, real assertions)
    runs-on: ubuntu-latest
    # Deliberately NOT using the `services:` shorthand for MongoDB here —
    # that syntax has no way to pass --replSet as a command-line argument to
    # the image, and this app relies on real multi-document transactions
    # (posSaleService, saleReturnService, purchaseService, etc.). MongoDB
    # only supports transactions on a replica set (or mongos), and a plain
    # standalone mongod rejects them outright with "Transaction numbers are
    # only allowed on a replica set member or mongos." So MongoDB is
    # started manually below via `docker run`, with --replSet set, then
    # initiated as a single-node replica set before the smoke test runs.
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/pos_erp_ci?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci_test_secret_not_used_for_anything_real_1234567890
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0

          echo "Waiting for MongoDB to accept connections..."
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1 && break
            sleep 1
          done

          echo "Initiating single-node replica set..."
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }]})'

          echo "Waiting for it to become PRIMARY..."
          for i in $(seq 1 30); do
            STATE=$(docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null || echo 0)
            if [ "$STATE" = "1" ]; then echo "Replica set is PRIMARY."; break; fi
            sleep 1
          done

      - name: Install dependencies
        run: npm ci

      - name: Run the smoke test against a real database
        run: npm run smoke-test

      - name: Run the Jest business-rule test suite against a real database
        run: npm test
