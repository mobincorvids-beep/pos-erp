# CI — runs on every push and PR. Deliberately does NOT run the smoke test
# here even though a real MongoDB is trivially available in GitHub Actions
# (as a service container) — wiring that in is a natural next step, but
# this workflow only does what's been verified to actually work: syntax
# checks, require-walks, npm audit, and the client build, mirroring
# exactly the verification steps used throughout this project's
# development (see README's "Verifying it actually works" section).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — syntax, require-walk, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every backend file
        run: |
          find src -name "*.js" | while read f; do
            node --check "$f" || exit 1
          done

      - name: Require-walk (catches import errors, missing exports, broken references)
        run: |
          node -e "
          const fs = require('fs'); const path = require('path');
          let ok = true;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.js') && !full.endsWith('server.js') && !full.endsWith('seed.js') && !full.endsWith('seedPlatformAdmin.js') && !full.endsWith('smokeTest.js')) {
                try { require(path.resolve(full)); } catch (e) { ok = false; console.log('FAIL', full, '->', e.message); }
              }
            }
          }
          walk('src');
          if (!ok) process.exit(1);
          console.log('Require-walk passed.');
          "

      - name: npm audit (fails the build on any high/critical vulnerability)
        run: npm audit --audit-level=high

  client:
    name: Client — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: npm audit (fails the build on any high/critical vulnerability)
        run: npm audit --audit-level=high

  smoke-test:
    name: Smoke test (real MongoDB, real assertions)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/pos_erp_ci
      JWT_SECRET: ci_test_secret_not_used_for_anything_real_1234567890
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the smoke test against a real database
        run: npm run smoke-test
