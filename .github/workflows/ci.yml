# CI — runs on every push and PR. Three independent jobs: backend
# (syntax/require-walk/audit), client (build/audit), and a smoke-test job
# that runs the real integration smoke test against an actual MongoDB
# service container — this workflow does NOT skip the smoke test, despite
# an earlier version of this comment claiming otherwise.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — syntax, require-walk, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every backend file
        run: |
          find src -name "*.js" | while read f; do
            node --check "$f" || exit 1
          done

      - name: Require-walk (catches import errors, missing exports, broken references)
        run: |
          node -e "
          const fs = require('fs'); const path = require('path');
          let ok = true;
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.js') && !full.endsWith('server.js') && !full.endsWith('seed.js') && !full.endsWith('seedPlatformAdmin.js') && !full.endsWith('smokeTest.js')) {
                try { require(path.resolve(full)); } catch (e) { ok = false; console.log('FAIL', full, '->', e.message); }
              }
            }
          }
          walk('src');
          if (!ok) process.exit(1);
          console.log('Require-walk passed.');
          "

      - name: npm audit (fails the build on any high/critical vulnerability)
        run: npm audit --audit-level=high

  client:
    name: Client — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # --omit=dev: the only high-severity advisory here is esbuild's dev-server
      # request-spoofing issue (GHSA-67mh-4wv8-2f99), which only matters if
      # someone runs `vite`'s dev server on a machine an attacker can reach —
      # it ships in devDependencies and is never part of the production
      # build output above. Auditing devDependencies here would fail CI on a
      # vulnerability that can't actually affect a deployed build; production
      # dependencies are still audited at full strictness.
      - name: npm audit (fails the build on any high/critical vulnerability in production dependencies)
        run: npm audit --omit=dev --audit-level=high

  smoke-test:
    name: Smoke test (real MongoDB, real assertions)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/pos_erp_ci
      JWT_SECRET: ci_test_secret_not_used_for_anything_real_1234567890
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run the smoke test against a real database
        run: npm run smoke-test
