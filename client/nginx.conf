server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — a direct request or a page
    # refresh on e.g. /admin/companies has no matching file on disk, so
    # nginx must fall back to index.html and let the client-side router
    # handle it, rather than returning its default 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite (e.g. index-DQguvAWn.js) —
    # safe to cache aggressively since a new deploy produces a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
